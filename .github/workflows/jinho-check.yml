name: JinhoDesk quick check (flutter analyze)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  analyze:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply JinhoDesk branding
        run: |
          python3 jinho/apply_branding.py
          python3 jinho/check_branding.py

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Hangul composer check
        run: dart run jinho/hangul_check.dart

      - name: Analyze changed Dart code (errors fail the job)
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/mobile/widgets/hangul_composer.dart \
            lib/mobile/widgets/jinho_side_keyboard.dart \
            lib/mobile/pages/remote_page.dart \
            lib/models/model.dart \
            lib/common.dart lib/desktop/pages/desktop_home_page.dart \
            lib/desktop/pages/desktop_setting_page.dart \
            lib/mobile/pages/connection_page.dart \
            lib/desktop/pages/connection_page.dart \
            lib/common/widgets/peer_card.dart \
            lib/common/widgets/peer_tab_page.dart \
            lib/common/widgets/peers_view.dart \
            lib/models/peer_model.dart lib/consts.dart
